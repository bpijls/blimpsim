# Used only by the production build (frontend/Dockerfile.prod → nginx).
# The default compose setup serves the frontend from the Vite dev server.
map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
}

server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    location / {
        try_files $uri $uri/ /index.html;   # SPA fallback
    }

    location /api/ {
        proxy_pass http://api:8000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        # /api/blimp/telemetry is a WebSocket.
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        # /api/blimp/camera.mjpg never ends and must not be held back.
        proxy_buffering off;
        proxy_read_timeout 3600s;
    }
}
