[project]
name = "blimpsim-client"
version = "0.1.0"
description = "Gymnasium environment and baseline tracker for the blimpsim digital twin."
requires-python = ">=3.11"
dependencies = [
    "gymnasium>=1.0",
    "httpx>=0.27",
    "numpy>=1.26",
    "pillow>=10",
    "websockets>=13",
]

[project.optional-dependencies]
dev = ["pytest>=8", "ruff>=0.6"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.ruff]
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["sim: needs the live simulator (set BLIMPSIM_API_URL, BLIMPSIM_GATEWAY_URL, SIM_SECRET)"]
